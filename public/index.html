<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth Test</title>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="flex flex-col justify-center items-center h-screen space-y-4">
    <h3 class="font-bold text-xl">Auth Test</h3>

    <div
      class="flex flex-col justify-center items-center border px-10 py-10 rounded-xl space-y-6"
      id="auth-form"
    >
      <div class="flex space-x-10">
        <label for="name">Name:</label>

        <input
          type="text"
          placeholder="Enter name"
          class="border border-gray-300 rounded-md px-3 py-1 outline-none focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400"
          id="name"
        />
      </div>

      <div class="flex space-x-4">
        <label for="password">Password:</label>

        <input
          type="password"
          placeholder="Enter password"
          class="border border-gray-300 rounded-md px-3 py-1 outline-none focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400"
          id="password"
        />
      </div>

      <div class="flex space-x-4">
        <button
          class="bg-gray-400 text-white px-3 py-1 rounded-lg font-semibold"
          onclick="signup()"
        >
          Sign Up
        </button>

        <button
          class="bg-gray-400 text-white px-3 py-1 rounded-lg font-semibold"
          onclick="login()"
        >
          Log In
        </button>
      </div>
    </div>

    <div
      class="flex flex-col justify-center items-center border px-10 py-10 rounded-xl space-y-6"
    >
      <p class="font-bold text-xl">Dashboard</p>

      <p id="dashboardMessage">You are not logged in</p>

      <button
        id="logoutButton"
        onclick="logout()"
        class="hidden bg-red-500 text-white px-3 py-1 rounded-lg font-semibold"
      >
        Logout
      </button>
    </div>

    <script>
      const name = document.getElementById("name");
      const password = document.getElementById("password");

      const dashboardMessage = document.getElementById("dashboardMessage");
      const authForm = document.getElementById("auth-form");
      const logoutButton = document.getElementById("logoutButton");

      const signup = async () => {
        try {
          const res = await axios.post(
            "http://localhost:5000/api/auth/signup",
            {
              name: name.value,
              password: password.value,
            },
          );

          console.log(res.data);

          localStorage.setItem("token", res.data.token);

          await getMe();
        } catch (error) {
          console.log(error.response?.data || error.message);
        }
      };

      // LOGIN
      const login = async () => {
        try {
          const res = await axios.post("http://localhost:5000/api/auth/login", {
            name: name.value,
            password: password.value,
          });

          console.log(res.data);

          // Store token
          localStorage.setItem("token", res.data.token);

          // Get current user
          await getMe();
        } catch (error) {
          console.log(error.response?.data || error.message);
        }
      };

      // GET /ME
      const getMe = async () => {
        try {
          const token = localStorage.getItem("token");

          if (!token) {
            return;
          }

          const res = await axios.get("http://localhost:5000/api/auth/me", {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          console.log("ME:", res.data);

          dashboardMessage.textContent = `You are logged in as ${res.data.name}`;

          logoutButton.classList.remove("hidden");

          authForm.classList.add("hidden");
        } catch (error) {
          console.log(error.response?.data || error.message);

          // Invalid/expired token
          localStorage.removeItem("token");

          dashboardMessage.textContent = "You are not logged in";

          logoutButton.classList.add("hidden");
        }
      };

      // LOGOUT
      const logout = () => {
        localStorage.removeItem("token");

        dashboardMessage.textContent = "You are not logged in";

        logoutButton.classList.add("hidden");
        authForm.classList.remove("hidden");
      };

      // Check login when page loads
      getMe();
    </script>
  </body>
</html>
